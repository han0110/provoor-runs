name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: han0110/benchmarkoor
          ref: feature/provoor
          path: benchmarkoor
      - uses: actions/setup-go@v7
        with:
          go-version-file: benchmarkoor/go.mod
          cache-dependency-path: benchmarkoor/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build site
        run: BENCHMARKOOR=benchmarkoor scripts/build.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
