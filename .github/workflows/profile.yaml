name: profile

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runs: ${{ steps.scan.outputs.runs }}
      blocked: ${{ steps.scan.outputs.blocked }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: han0110/provoor
          path: provoor
      - run: git -C provoor submodule update --init --depth 1 benchmarkoor
      - uses: actions/setup-go@v7
        with:
          go-version-file: provoor/go.mod
          cache-dependency-path: provoor/go.sum
      - run: provoor/scripts/fetch-verifier.sh
      - run: (cd provoor && go build -o ../provoor-bin ./cmd/provoor)
      - uses: actions/upload-artifact@v7
        with:
          name: provoor
          path: provoor-bin
      - id: scan
        env:
          PROVOOR: ${{ github.workspace }}/provoor-bin
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        # The assignment keeps the exit status of the scan.
        run: |
          scan="$(scripts/profile.sh scan "${RUN_ID}")"
          echo "runs=$(jq -c .runs <<< "${scan}")" >> "${GITHUB_OUTPUT}"
          echo "blocked=$(jq -c .blocked <<< "${scan}")" >> "${GITHUB_OUTPUT}"

  blocked:
    needs: scan
    if: needs.scan.outputs.blocked != '[]'
    runs-on: ubuntu-latest
    steps:
      - env:
          BLOCKED: ${{ needs.scan.outputs.blocked }}
        run: |
          echo "::error::blocked runs ${BLOCKED}, see the scan summary"
          exit 1

  profile:
    needs: scan
    if: needs.scan.outputs.runs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.scan.outputs.runs) }}
    concurrency:
      group: profile-${{ matrix.run }}
      cancel-in-progress: false
    steps:
      # 5.5 hours, so the push ends before the 6 hour job limit.
      - run: echo "DEADLINE=$(( $(date +%s) + 19800 ))" >> "${GITHUB_ENV}"
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: provoor
      - run: chmod +x provoor-bin
      - env:
          PROVOOR: ${{ github.workspace }}/provoor-bin
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ matrix.run }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          scripts/profile.sh run "${RUN_ID}" "${DEADLINE}"
